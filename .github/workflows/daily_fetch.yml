name: 💰 SOLIDUS Daily Data Fetch

on:
  schedule:
    # 매일 UTC 06:00 (KST 15:00) — 미국 장마감 후
    - cron: '0 6 * * *'
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: 📡 데이터 수집
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/daily_update.py

      - name: 📤 커밋 + 푸시
        run: |
          git config user.name "solidus-bot"
          git config user.email "solidus-bot@users.noreply.github.com"
          git add -A
          # 변경 있을 때만 커밋
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            DATE=$(date -u +"%Y-%m-%d")
            git commit -m "📊 daily update ${DATE}"
            git push
          fi
